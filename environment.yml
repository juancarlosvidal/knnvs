name: knnvs
channels:
  - conda-forge
  - defaults
  - r
dependencies:
  # Pinned to versions reported in Appendix A.2 of the paper
  - python=3.8.13
  - faiss-cpu=1.7.2
  - numpy=1.22.*
  - scikit-learn=1.0.2
  # Other direct dependencies (version-agnostic)
  - matplotlib
  - mpld3
  - scienceplots
  - seaborn
  - scipy
  - statsmodels
  - pingouin
  - tqdm
  - pandas
  - joblib
  - rpy2
  - r-base
  - r-essentials
  - black
  - nb_black
